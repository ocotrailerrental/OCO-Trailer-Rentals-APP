<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OCO Trailer Rentals">
  <!-- Badge ground: the logo's deep ink #16272F -->
  <rect width="64" height="64" rx="14" fill="#16272F"/>
  <!-- Steel-blue disc with a white ring, echoing the logo's enclosed badge -->
  <circle cx="32" cy="32" r="21" fill="#486C7B" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Enclosed trailer, simplified until it still reads at 16px -->
  <path d="M18 36V24h20l6 5v7z" fill="#FFFFFF"/>
  <path d="M38 24v12" stroke="#486C7B" stroke-width="1.6"/>
  <circle cx="24" cy="40" r="3.4" fill="#FFFFFF"/>
  <circle cx="24" cy="40" r="1.3" fill="#16272F"/>
  <circle cx="39" cy="40" r="3.4" fill="#FFFFFF"/>
  <circle cx="39" cy="40" r="1.3" fill="#16272F"/>
  <!-- Hitch -->
  <path d="M18 36h-4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
</svg>
